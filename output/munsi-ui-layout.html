<div id="munsi-layout-preview" class="viz-dotted-background">
  <div class="mk-stage">
    <div class="mk-caption">MUNSI KIRANA STORE <span>Layout concept · Sample data</span></div>
    <div class="mk-phone" aria-label="Munsi Kirana Store mobile layout">
      <div id="mk-content"></div>
      <nav class="mk-bottom" aria-label="Main navigation">
        <button type="button" data-go="home"><i data-lucide="house" aria-hidden="true"></i><span data-hi="होम" data-en="Home">होम</span></button>
        <button type="button" data-go="billing"><i data-lucide="receipt-text" aria-hidden="true"></i><span data-hi="बिल" data-en="Bill">बिल</span></button>
        <button type="button" data-go="ledger"><i data-lucide="notebook-pen" aria-hidden="true"></i><span data-hi="खाता" data-en="Khata">खाता</span></button>
        <button type="button" data-go="more"><i data-lucide="grid-2x2" aria-hidden="true"></i><span data-hi="और" data-en="More">और</span></button>
      </nav>
    </div>
    <div id="mk-message" class="mk-feedback" role="status" aria-live="polite"></div>
  </div>
</div>
<style>

  #munsi-layout-preview .mk-phone svg {width:23px;height:23px;stroke-width:1.8;flex-shrink:0}
  #munsi-layout-preview .mk-hero {padding:24px 20px 20px;background:light-dark(#5f259f,#4f257e);color:#fff}
  #munsi-layout-preview .mk-brand {display:flex;align-items:center;gap:12px}
  #munsi-layout-preview .mk-avatar {width:52px;height:52px;border-radius:50%;background:#fff0d6;color:#5f259f;display:grid;place-items:center;font-size:28px;font-weight:700;flex-shrink:0;border:3px solid #ffffff50}
  #munsi-layout-preview .mk-brand-name {font-size:19px;line-height:1.25;font-weight:750;letter-spacing:-.3px}

  #munsi-layout-preview .mk-greeting {margin-top:22px;font-size:24px;line-height:1.3;font-weight:700}
  #munsi-layout-preview .mk-language {min-height:44px;min-width:44px;padding:6px 9px;border:1px solid #ffffff55;border-radius:12px;background:#ffffff12;color:#fff;font-size:14px;margin-left:auto;flex-shrink:0}
  #munsi-layout-preview .mk-main {padding:18px}
  #munsi-layout-preview .mk-status {display:flex;align-items:center;gap:7px;color:var(--mk-green);font-size:13px;margin-bottom:14px}
  #munsi-layout-preview .mk-status svg {width:16px;height:16px}
  #munsi-layout-preview .mk-search {display:flex;align-items:center;background:var(--mk-surface);border:1px solid var(--mk-line);border-radius:var(--mk-radius);min-height:62px;padding:4px 5px 4px 14px;gap:8px}
  #munsi-layout-preview .mk-search>svg {width:20px;color:var(--mk-muted)}
  #munsi-layout-preview .mk-search input {min-width:0;width:100%;border:0;background:transparent;color:var(--mk-text);font-size:16px;min-height:48px;padding:4px 0}
  #munsi-layout-preview .mk-search input::placeholder {color:var(--mk-muted);opacity:1}
  #munsi-layout-preview .mk-mic {width:52px;min-height:52px;display:grid;place-items:center;background:var(--mk-purple);border:0;border-radius:14px;color:#fff!important;flex-shrink:0}
  #munsi-layout-preview .mk-section-title {font-size:16px;font-weight:650;margin:22px 0 12px;color:var(--mk-muted)}

  #munsi-layout-preview .mk-tile-name {font-size:calc(var(--mk-size) + 1px);font-weight:700;line-height:1.35}
  #munsi-layout-preview .mk-tile small {display:block;font-size:12px;font-weight:400;margin-top:3px;color:var(--mk-muted)}
  #munsi-layout-preview .mk-featured small {color:#eee0ff}
  #munsi-layout-preview .mk-daily {margin-top:18px;background:var(--mk-surface);border:1px solid var(--mk-line);border-radius:var(--mk-radius);padding:16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  #munsi-layout-preview .mk-daily strong {display:block;font-size:25px;margin-top:3px}
  #munsi-layout-preview .mk-daily small {font-size:14px;color:var(--mk-muted)}
  #munsi-layout-preview .mk-icon-soft {width:45px;height:45px;border-radius:14px;display:grid;place-items:center;background:var(--mk-green-bg);color:var(--mk-green)}
  #munsi-layout-preview .mk-bottom {display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:7px 8px 10px;border-top:1px solid var(--mk-line);background:var(--mk-surface)}
  #munsi-layout-preview .mk-bottom button {min-height:61px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;border:0;background:transparent;border-radius:13px;color:var(--mk-muted);font-size:13px}
  #munsi-layout-preview .mk-bottom button[aria-current="page"] {color:var(--mk-purple);background:var(--mk-soft);font-weight:700}
  #munsi-layout-preview .mk-page-head {padding:17px 18px;background:var(--mk-surface);border-bottom:1px solid var(--mk-line);display:flex;align-items:center;gap:10px}
  #munsi-layout-preview .mk-page-head h2 {font-size:23px;font-weight:750;margin:0;line-height:1.3}
  #munsi-layout-preview .mk-icon-button {border:0;background:transparent;min-width:44px;min-height:48px;display:grid;place-items:center;padding:5px;border-radius:12px}
  #munsi-layout-preview .mk-page-head .mk-subtitle {font-size:13px;color:var(--mk-muted);margin-top:3px}
  #munsi-layout-preview .mk-badge {font-size:12px;background:var(--mk-green-bg);color:var(--mk-green);padding:6px 9px;border-radius:8px;white-space:nowrap;margin-left:auto}
  #munsi-layout-preview .mk-segment {display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--mk-soft);border-radius:14px;padding:4px;margin-bottom:17px}
  #munsi-layout-preview .mk-segment button {min-height:48px;border:0;border-radius:11px;background:transparent;font-size:15px}
  #munsi-layout-preview .mk-segment button[aria-pressed="true"] {background:var(--mk-surface);color:var(--mk-purple);font-weight:700;box-shadow:0 2px 4px #00000009}
  #munsi-layout-preview .mk-muted {color:var(--mk-muted);font-size:14px}
  #munsi-layout-preview .mk-row {display:flex;align-items:center;justify-content:space-between;gap:10px}
  #munsi-layout-preview .mk-panel {border:1px solid var(--mk-line);background:var(--mk-surface);border-radius:var(--mk-radius);padding:16px;margin-top:13px}
  #munsi-layout-preview .mk-item-name {font-size:var(--mk-size);font-weight:700}
  #munsi-layout-preview .mk-money {font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:700}
  #munsi-layout-preview .mk-divider {border:0;border-top:1px solid var(--mk-line);margin:14px 0}
  #munsi-layout-preview .mk-small-button {min-height:44px;background:transparent;border:0;padding:5px 8px;color:var(--mk-purple)!important;font-size:14px;font-weight:650;border-radius:8px}
  #munsi-layout-preview .mk-fields {display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  #munsi-layout-preview .mk-field {display:flex;flex-direction:column;gap:6px;min-width:0;font-size:14px;color:var(--mk-muted)}
  #munsi-layout-preview .mk-field input,#munsi-layout-preview .mk-field select {min-width:0;width:100%;min-height:56px;border:1px solid var(--mk-line);border-radius:12px;padding:9px 10px;background:var(--mk-bg);color:var(--mk-text);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
  #munsi-layout-preview .mk-field input[readonly] {background:var(--mk-bg)}
  #munsi-layout-preview .mk-primary {min-height:56px;width:100%;display:flex;align-items:center;justify-content:center;gap:9px;padding:12px 14px;background:var(--mk-purple);color:#fff!important;border:0;border-radius:14px;font-weight:700;margin-top:16px}
  #munsi-layout-preview .mk-secondary {min-height:56px;width:100%;padding:11px 12px;border:1px solid var(--mk-line);border-radius:14px;background:var(--mk-surface);font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
  #munsi-layout-preview .mk-payment {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
  #munsi-layout-preview .mk-payment button {min-height:50px;background:var(--mk-surface);border:1px solid var(--mk-line);border-radius:12px;font-size:15px}
  #munsi-layout-preview .mk-payment button[aria-pressed="true"] {border:2px solid var(--mk-purple);color:var(--mk-purple);background:var(--mk-soft);font-weight:700}
  #munsi-layout-preview .mk-total-bar {padding:17px 18px;background:var(--mk-surface);border-top:1px solid var(--mk-line);display:flex;align-items:center;justify-content:space-between;gap:12px}
  #munsi-layout-preview .mk-total-bar strong {font-size:27px;line-height:1.3;display:block}
  #munsi-layout-preview .mk-total-bar .mk-primary {width:auto;min-width:135px;margin:0}
  #munsi-layout-preview .mk-balance {background:var(--mk-purple);color:#fff;padding:21px;border-radius:var(--mk-radius);margin-bottom:17px}
  #munsi-layout-preview .mk-balance small {font-size:15px;color:#f1e5ff}
  #munsi-layout-preview .mk-balance strong {font-size:38px;display:block;line-height:1.3;margin:6px 0;font-variant-numeric:tabular-nums}
  #munsi-layout-preview .mk-two-actions {display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #munsi-layout-preview .mk-two-actions button {min-height:70px;font-size:15px;margin:0;flex-direction:column;gap:3px}
  #munsi-layout-preview .mk-person {width:42px;height:42px;display:grid;place-items:center;background:var(--mk-soft);color:var(--mk-purple);border-radius:50%;font-weight:700;flex-shrink:0}
  #munsi-layout-preview .mk-person-row {display:flex;align-items:center;gap:10px}
  #munsi-layout-preview .mk-person-row .mk-money {margin-left:auto}
  #munsi-layout-preview .mk-line-event {display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-size:16px;padding:12px 0;border-bottom:1px solid var(--mk-line)}
  #munsi-layout-preview .mk-line-event:last-child {border-bottom:0}
  #munsi-layout-preview .mk-positive {color:var(--mk-green)}
  #munsi-layout-preview .mk-duration {display:inline-flex;background:var(--mk-soft);color:var(--mk-purple);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:600;margin-top:16px}
  #munsi-layout-preview .mk-period {margin:12px 0;padding:12px 0;border-bottom:1px solid var(--mk-line)}
  #munsi-layout-preview .mk-period:last-child {border-bottom:0;padding-bottom:0}
  #munsi-layout-preview .mk-period .mk-row {font-size:15px;margin-top:6px}
  #munsi-layout-preview .mk-result {margin-top:16px;background:var(--mk-soft);border-radius:var(--mk-radius);padding:18px}
  #munsi-layout-preview .mk-result strong {font-size:32px;display:block}
  #munsi-layout-preview .mk-list-button {width:100%;display:flex;align-items:center;gap:12px;min-height:66px;padding:12px 4px;border:0;border-bottom:1px solid var(--mk-line);background:transparent;text-align:left}
  #munsi-layout-preview .mk-list-button>svg:last-child {margin-left:auto;width:18px;color:var(--mk-muted)}
  #munsi-layout-preview .mk-receipt-head {text-align:center;margin-bottom:20px}
  #munsi-layout-preview .mk-success {width:57px;height:57px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--mk-green-bg);color:var(--mk-green)}
  #munsi-layout-preview .mk-receipt-head h3 {font-size:24px;margin:0 0 5px}
  #munsi-layout-preview .mk-receipt {background:var(--mk-surface);border:1px solid var(--mk-line);border-radius:var(--mk-radius);padding:19px}
  #munsi-layout-preview .mk-receipt-brand {text-align:center;font-size:20px;font-weight:750}
  #munsi-layout-preview .mk-whatsapp {background:light-dark(#187348,#256e4b)}
  #munsi-layout-preview .mk-note {padding:12px 14px;background:var(--mk-orange-bg);color:var(--mk-orange);font-size:14px;border-radius:12px;margin-top:12px}
  #munsi-layout-preview .mk-results:empty {display:none}
  #munsi-layout-preview .mk-results {margin-top:10px}
  #munsi-layout-preview .mk-feedback {font:14px/1.5 system-ui,sans-serif;color:light-dark(#51495e,#d6c9e4);text-align:center;margin-top:12px}
  #munsi-layout-preview .mk-feedback:empty {display:none}
  #munsi-layout-preview .mk-info-sheet {background:var(--mk-soft);border-radius:14px;padding:16px;margin-top:12px}
  @media(max-width:380px) {
    #munsi-layout-preview {padding:12px 3px}
    #munsi-layout-preview .mk-main {padding:14px}
    #munsi-layout-preview .mk-hero {padding:20px 14px}
    #munsi-layout-preview .mk-brand {gap:9px}
    #munsi-layout-preview .mk-avatar {width:43px;height:43px;font-size:25px}
    #munsi-layout-preview .mk-brand-name {font-size:17px}
    #munsi-layout-preview .mk-language {padding:5px;min-width:40px}
    #munsi-layout-preview .mk-tile {padding:14px 12px}
    #munsi-layout-preview .mk-tile-name {font-size:var(--mk-size)}
    #munsi-layout-preview .mk-total-bar {padding:14px}
    #munsi-layout-preview .mk-total-bar .mk-primary {min-width:0;font-size:16px}
    #munsi-layout-preview .mk-total-bar strong {font-size:24px}
    #munsi-layout-preview .mk-person-row {flex-wrap:wrap}
  }
</style>
<script>
(() => {
  const root = document.getElementById('munsi-layout-preview');
  const phone = root.querySelector('.mk-phone');
  const content = root.querySelector('#mk-content');
  const feedback = root.querySelector('#mk-message');
  const state = {screen:'home', hindi:true, textSize:18, radius:18, payment:'cash', editing:null, balance:550, ledgerForm:null, cost:null};
  const products = [
    {id:'sugar', name:'Sugar', hindi:'चीनी', aliases:'sugar su chini cheeni shakkar चीनी', rate:60, cost:52, unit:'kg'},
    {id:'oil', name:'Groundnut oil', hindi:'मूंगफली तेल', aliases:'groundnut oil mungfali ka tel moongfali मूंगफली का तेल', rate:180, cost:155, unit:'L'},
    {id:'vim', name:'Vim', hindi:'विम', aliases:'vim विम', rate:30, cost:25, unit:'pack'}
  ];
  const basket = [{id:'sugar',name:'Sugar',hindi:'चीनी',quantity:2.5,rate:59.5,unit:'kg'},{id:'oil',name:'Groundnut oil',hindi:'मूंगफली तेल',quantity:0.5,rate:180,unit:'L'}];
  const text = (hi,en) => state.hindi ? hi : en;
  const money = n => '₹' + Number(n).toLocaleString('en-IN',{minimumFractionDigits:Number.isInteger(Number(n))?0:2,maximumFractionDigits:2});
  const round = n => Math.round((n + Number.EPSILON)*100)/100;
  const total = () => basket.reduce((sum,item) => sum+round(item.quantity*item.rate),0);
  const icon = name => '<i data-lucide="'+name+'" aria-hidden="true"></i>';
  const button = (label,action,classes='mk-primary') => '<button type="button" class="'+classes+'" data-action="'+action+'">'+label+'</button>';
  const goButton = (label,screen,classes='mk-secondary') => '<button type="button" class="'+classes+'" data-go="'+screen+'">'+label+'</button>';
  const pageHead = (hi,en,subtitle) => '<header class="mk-page-head"><button type="button" class="mk-icon-button" data-go="home" aria-label="Home">'+icon('arrow-left')+'</button><div><h2>'+text(hi,en)+'</h2>'+(subtitle?'<div class="mk-subtitle">'+subtitle+'</div>':'')+'</div></header>';
  const initIcons = () => { if(globalThis.lucide) globalThis.lucide.createIcons(); };
  const persist = () => {
    if(window.openai && window.openai.setWidgetState) window.openai.setWidgetState({modelContent:{layout:'Munsi counter layout',screen:state.screen,language:state.hindi?'Hindi':'English',textSize:state.textSize},privateContent:{screen:state.screen,hindi:state.hindi,textSize:state.textSize,radius:state.radius}}).catch(()=>{});
  };
  function restore(saved) {
    const s = saved && saved.privateContent;
    if(!s) return;
    if(['home','billing','ledger','interest','inventory','receipt','more','reports'].includes(s.screen)) state.screen=s.screen;
    if(typeof s.hindi==='boolean') state.hindi=s.hindi;
    if([18,19,20,21,22].includes(s.textSize)) state.textSize=s.textSize;
    if(Number.isFinite(s.radius)) state.radius=Math.min(24,Math.max(12,s.radius));
  }
  function home() {
    const tiles=[['billing','receipt-text','बिल बनाएँ','New bill'],['inventory','package-plus','सामान जोड़ें','Manage items'],['interest','calculator','ब्याज निकालें','Byaj calculator'],['ledger','notebook-pen','उधार खाता','Customer khata']];
    return '<header class="mk-hero"><div class="mk-brand"><div class="mk-avatar" aria-label="Munsi family monogram">म</div><div><div class="mk-brand-name">Munsi Kirana Store</div><div class="mk-brand-sub">'+text('अपनी दुकान, अपना भरोसा','Your family. Your trusted store.')+'</div></div><button type="button" class="mk-language" data-action="language" aria-label="Switch language">'+text('EN','हिं')+'</button></div><div class="mk-greeting">'+text('आज का काम, आसान।','A simpler day at the shop.')+'</div></header><main class="mk-main"><div class="mk-status">'+icon('circle-check')+text('इस फ़ोन पर सुरक्षित · नमूना','Saved on this phone · Demo')+'</div><div class="mk-search">'+icon('search')+'<input id="mk-search" aria-label="Search item rates" placeholder="'+text('नाम लिखें या बोलें…','Type or speak an item…')+'"><button type="button" class="mk-mic" data-action="voice-demo" aria-label="Preview Hindi voice search">'+icon('mic')+'</button></div><div id="mk-search-results" class="mk-results" aria-live="polite"></div><div class="mk-section-title">'+text('क्या करना है?','What would you like to do?')+'</div><div class="mk-tiles">'+tiles.map((t,i)=>'<button type="button" class="mk-tile '+(i===0?'mk-featured':'')+'" data-go="'+t[0]+'"><span class="mk-tile-icon">'+icon(t[1])+'</span><span class="mk-tile-name">'+text(t[2],t[3])+'<small>'+text(t[3],t[2])+'</small></span></button>').join('')+'</div><div class="mk-daily"><div><small>'+text('आज की बिक्री','Today’s sales')+'</small><strong class="mk-money">₹238.75</strong></div><div><span class="mk-icon-soft">'+icon('shopping-bag')+'</span><small>'+text('1 बिल','1 bill')+'</small></div></div></main>';
  }
  function productRows(query,addMode) {
    const filtered=products.filter(p=>(p.name+' '+p.hindi+' '+p.aliases).toLowerCase().includes(query.trim().toLowerCase()));
    if(!filtered.length) return '<div class="mk-panel mk-muted">'+text('कोई सामान नहीं मिला','No matching item')+'</div>';
    return filtered.map(p=>'<div class="mk-panel"><div class="mk-row"><div><div class="mk-item-name">'+text(p.hindi,p.name)+'</div><div class="mk-muted">'+text(p.name,p.hindi)+' · '+p.unit+'</div></div><div class="mk-money">'+money(p.rate)+'</div><button type="button" class="mk-icon-button" data-action="'+(addMode?'add-product':'cost')+'" data-id="'+p.id+'" aria-label="'+(addMode?'Add ':'Purchase cost for ')+p.name+'">'+icon(addMode?'plus':'info')+'</button></div>'+(state.cost===p.id?'<div class="mk-info-sheet"><div class="mk-muted">'+text('खरीद भाव · निजी','Purchase cost · Private')+'</div><strong>'+money(p.cost)+' / '+p.unit+'</strong><div class="mk-muted">'+text('नमूना मूल्य; थोक बिल नहीं जुड़ा','Sample cost; no wholesale photo attached')+'</div></div>':'')+'</div>').join('');
  }
  function billing() {
    return pageHead('नया बिल','New bill',text('ड्राफ्ट · नमूना','Draft · Demo'))+'<main class="mk-main"><div class="mk-segment"><button type="button" aria-pressed="true" data-go="billing">'+text('बिल बनाएँ','Create bill')+'</button><button type="button" aria-pressed="false" data-go="inventory">'+text('सामान जोड़ें','Manage items')+'</button></div><div class="mk-row"><span class="mk-muted">'+text('ग्राहक','Customer')+'</span><span>'+text('नकद ग्राहक','Walk-in customer')+'</span></div><button type="button" class="mk-primary" data-action="show-add">'+icon('plus')+text('सामान जोड़ें','Add an item')+'</button><div id="mk-add-items"></div><div class="mk-section-title">'+text('बिल में सामान','Items in this bill')+' · '+basket.length+'</div>'+basket.map((item,i)=>'<div class="mk-panel"><div class="mk-row"><div><div class="mk-item-name">'+text(item.hindi,item.name)+'</div><div class="mk-muted">'+item.quantity+' '+item.unit+' × '+money(item.rate)+'</div></div><span class="mk-money">'+money(round(item.quantity*item.rate))+'</span></div><div class="mk-row"><button type="button" class="mk-small-button" data-action="edit" data-index="'+i+'">'+text(state.editing===i?'पूरा हुआ':'बदलें',state.editing===i?'Done':'Edit')+'</button><button type="button" class="mk-icon-button" data-action="cost" data-id="'+item.id+'" aria-label="Purchase cost">'+icon('info')+'</button></div>'+(state.editing===i?'<div class="mk-fields"><label class="mk-field">'+text('भाव ₹ / ','Rate ₹ / ')+item.unit+'<input inputmode="decimal" type="number" min="0" step="0.01" data-price="'+i+'" value="'+item.rate+'"></label><label class="mk-field">'+text('मात्रा · ','Quantity · ')+item.unit+'<input inputmode="decimal" type="number" min="0.001" step="0.001" data-qty="'+i+'" value="'+item.quantity+'"></label></div><div class="mk-muted">'+text('बदला भाव सिर्फ़ इस बिल के लिए','Edited rate applies to this bill only')+'</div>':'')+(state.cost===item.id?'<div class="mk-info-sheet">'+text('खरीद भाव','Purchase cost')+': '+money(products.find(p=>p.id===item.id).cost)+' / '+item.unit+'</div>':'')+'</div>').join('')+'<div class="mk-section-title">'+text('भुगतान का तरीका','Payment method')+'</div><div class="mk-payment">'+[['cash','नकद','Cash'],['upi','UPI','UPI'],['credit','उधार','Credit']].map(p=>'<button type="button" data-payment="'+p[0]+'" aria-pressed="'+(state.payment===p[0])+'">'+text(p[1],p[2])+'</button>').join('')+'</div>'+(state.payment==='credit'?'<div class="mk-note">'+text('उधार ग्राहक: नमूना ग्राहक','Credit customer: Sample customer')+'</div>':'')+'</main><div class="mk-total-bar"><div><span class="mk-muted">'+text('कुल रकम','Grand total')+'</span><strong id="mk-bill-total" class="mk-money">'+money(total())+'</strong></div>'+goButton(text('बिल देखें','View receipt'),'receipt','mk-primary')+'</div>';
  }
  function ledger() {
    return pageHead('उधार खाता','Customer khata')+'<main class="mk-main"><div class="mk-balance"><small>'+text('कुल बकाया','Total outstanding')+'</small><strong>'+money(state.balance)+'</strong><small>'+text('1 ग्राहक · नमूना खाता','1 customer · Sample account')+'</small></div><div class="mk-two-actions">'+button(icon('plus')+text('उधार जोड़ें','Add credit'),'charge','mk-secondary')+button(icon('hand-coins')+text('भुगतान मिला','Received payment'),'repayment')+'</div>'+(state.ledgerForm?'<div class="mk-panel"><label class="mk-field">'+text('रकम ₹','Amount ₹')+'<input id="mk-ledger-amount" type="number" inputmode="decimal" min="0.01" value="200"></label>'+button(text('नमूने में जोड़ें','Apply to sample'),'apply-ledger')+'</div>':'')+'<div class="mk-section-title">'+text('ग्राहक का हिसाब','Customer account')+'</div><div class="mk-panel"><div class="mk-person-row"><div class="mk-person">न</div><div><div class="mk-item-name">'+text('नमूना ग्राहक','Sample customer')+'</div><div class="mk-muted">'+text('शेष बकाया','Remaining balance')+'</div></div><strong class="mk-money">'+money(state.balance)+'</strong></div><hr class="mk-divider"><div class="mk-line-event"><div>'+text('सामान उधार','Groceries on credit')+'<div class="mk-muted">30 Oct · Sample</div></div><span class="mk-money">+ ₹750</span></div><div class="mk-line-event"><div>'+text('नकद मिला','Cash received')+'<div class="mk-muted">31 Oct · Sample</div></div><span class="mk-money mk-positive">− ₹200</span></div>'+(state.balance!==550?'<div class="mk-line-event"><div>'+text('नमूने के बदलाव','Preview adjustments')+'</div><span class="mk-money">'+(state.balance>550?'+ ':'− ')+money(Math.abs(state.balance-550))+'</span></div>':'')+button(icon('message-circle')+text('याद दिलाएँ','Send reminder'),'reminder','mk-secondary')+'</div><div id="mk-reminder"></div></main>';
  }
  function interest() {
    return pageHead('ब्याज निकालें','Byaj calculator',text('मासिक दर · सालाना चक्रवृद्धि','Monthly rate · Compounded yearly'))+'<main class="mk-main"><div class="mk-panel" style="margin-top:0"><div class="mk-row"><strong>'+text('पहली रकम','Loan entry')+'</strong><span class="mk-muted">'+text('नमूना','Sample')+'</span></div><div class="mk-fields"><label class="mk-field">'+text('मूलधन ₹','Principal ₹')+'<input id="mk-principal" type="number" inputmode="decimal" value="10000" min="0"></label><label class="mk-field">'+text('महीने का ब्याज %','Monthly rate %')+'<input id="mk-rate" type="number" inputmode="decimal" value="2" min="0" step="0.1"></label><label class="mk-field">'+text('शुरू की तारीख','Start date')+'<input id="mk-start" inputmode="numeric" maxlength="10" value="01-01-2024" aria-label="Start date DD-MM-YYYY"></label><label class="mk-field">'+text('अंतिम तारीख','Custom end date')+'<input id="mk-end" inputmode="numeric" maxlength="10" value="01-01-2026" aria-label="End date DD-MM-YYYY"></label></div>'+button(icon('calculator')+text('हिसाब निकालें','Calculate'),'calculate')+'</div><div id="mk-interest-results" aria-live="polite"></div></main>';
  }
  function parseDate(value) {
    if(!/^\d{2}-\d{2}-\d{4}$/.test(value)) return null;
    const [d,m,y]=value.split('-').map(Number);
    const date=new Date(Date.UTC(y,m-1,d));
    return y>=1900 && y<=2200 && date.getUTCDate()===d && date.getUTCMonth()===m-1 && date.getUTCFullYear()===y ? date : null;
  }
  function shifted(date,months) {
    const base=new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth()+months,1));
    const last=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth()+1,0)).getUTCDate();
    return new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth(),Math.min(date.getUTCDate(),last)));
  }
  function calculate() {
    const p=Number(root.querySelector('#mk-principal').value),r=Number(root.querySelector('#mk-rate').value);
    const start=parseDate(root.querySelector('#mk-start').value),end=parseDate(root.querySelector('#mk-end').value);
    const output=root.querySelector('#mk-interest-results');
    if(!start||!end||end<start||!Number.isFinite(p)||!Number.isFinite(r)||p<0||p>1e9||r<0||r>100) {output.innerHTML='<div class="mk-note" role="alert">'+text('रकम, दर और तारीख सही भरें।','Enter valid amounts, rates, and dates.')+'</div>';return;}
    let years=end.getUTCFullYear()-start.getUTCFullYear();
    if(shifted(start,years*12)>end) years--;
    if(years>100) {output.innerHTML='<div class="mk-note" role="alert">Preview supports up to 100 years.</div>';return;}
    const anchor=shifted(start,years*12);
    let months=0;while(months<11&&shifted(anchor,months+1)<=end) months++;
    const days=Math.round((end-shifted(anchor,months))/86400000);
    let balance=round(p);const periods=[];
    for(let i=0;i<years;i++){const amount=round(balance*r*12/100);periods.push({label:text('साल ','Year ')+(i+1),opening:balance,interest:amount,closing:round(balance+amount)});balance=round(balance+amount);}
    if(months||days){const amount=round(balance*r/100*(months+days/30));periods.push({label:text('बाकी अवधि','Remaining period'),opening:balance,interest:amount,closing:round(balance+amount)});balance=round(balance+amount);}
    if(!Number.isFinite(balance)||balance>1e12){output.innerHTML='<div class="mk-note" role="alert">'+text('यह रकम नमूने की सीमा से बाहर है।','Amount exceeds this preview’s range.')+'</div>';return;}
    output.innerHTML='<div class="mk-duration">'+years+text(' साल · ',' years · ')+months+text(' महीने · ',' months · ')+days+text(' दिन',' days')+'</div><div class="mk-panel">'+periods.map(row=>'<div class="mk-period"><strong>'+row.label+'</strong><div class="mk-row"><span class="mk-muted">'+text('शुरू की रकम','Opening')+'</span><span class="mk-money">'+money(row.opening)+'</span></div><div class="mk-row"><span class="mk-muted">'+text('ब्याज','Interest')+'</span><span class="mk-money">+ '+money(row.interest)+'</span></div><div class="mk-row"><span>'+text('कुल','Closing')+'</span><strong class="mk-money">'+money(row.closing)+'</strong></div></div>').join('')+(periods.length?'':'<div class="mk-muted">'+text('इस अवधि में ब्याज नहीं','No elapsed interest period')+'</div>')+'</div><div class="mk-result"><span>'+text('कुल देय रकम','Final payable amount')+'</span><strong class="mk-money">'+money(balance)+'</strong><span class="mk-muted">'+text('मूलधन ','Principal ')+money(p)+' + '+text('ब्याज ','interest ')+money(round(balance-p))+'</span></div><div class="mk-muted" style="margin-top:12px">'+text('बाकी दिनों का ब्याज: 30 दिन = 1 महीना।','Residual interest convention: 30 days = 1 month.')+'</div>';
  }
  function inventory() {
    return pageHead('सामान और भाव','Items & rates',text('बेचने का भाव सामने, खरीद भाव निजी','Selling rates visible · Purchase costs private'))+'<main class="mk-main"><div class="mk-search">'+icon('search')+'<input id="mk-inventory-search" aria-label="Search inventory" placeholder="'+text('सामान खोजें…','Find an item…')+'"></div><div id="mk-inventory-results">'+productRows('',false)+'</div><div class="mk-note">'+text('निजी खरीद भाव देखने के लिए ⓘ दबाएँ।','Tap ⓘ to reveal private purchase cost.')+'</div>'+goButton(icon('receipt-text')+text('बिल बनाएँ','Create bill'),'billing','mk-primary')+'</main>';
  }
  function receipt() {
    return pageHead('बिल की झलक','Receipt preview',text('नमूना — कोई असली बिल सेव नहीं हुआ','Sample — no real bill was saved'))+'<main class="mk-main"><div class="mk-receipt-head"><div class="mk-success">'+icon('check')+'</div><h3>'+text('साफ़-सुथरा हिसाब','A clear, simple receipt')+'</h3><div class="mk-muted">Sample receipt · MKS-001</div></div><div class="mk-receipt"><div class="mk-receipt-brand">Munsi Kirana Store</div><div class="mk-muted" style="text-align:center">1 Nov 2026 · Sample</div><hr class="mk-divider">'+basket.map(item=>'<div class="mk-line-event"><div>'+text(item.hindi,item.name)+'<div class="mk-muted">'+item.quantity+' '+item.unit+' × '+money(item.rate)+'</div></div><span class="mk-money">'+money(round(item.quantity*item.rate))+'</span></div>').join('')+'<div class="mk-row" style="margin-top:18px"><strong>'+text('कुल रकम','Grand total')+'</strong><strong class="mk-money" style="font-size:26px">'+money(total())+'</strong></div><div class="mk-row mk-muted" style="margin-top:8px"><span>'+text(state.payment==='credit'?'उधार बाकी':'मिला भुगतान',state.payment==='credit'?'Credit due':'Payment received')+'</span><span>'+money(total())+'</span></div></div>'+button(icon('message-circle')+text('WhatsApp पर भेजें','Share on WhatsApp'),'share-receipt','mk-primary mk-whatsapp')+'<div id="mk-share-preview"></div>'+goButton(icon('plus')+text('बिल पर वापस','Back to bill'),'billing','mk-secondary')+'</main>';
  }
  function more() {
    const links=[['inventory','package','सामान और भाव','Items & rates'],['interest','calculator','ब्याज कैलकुलेटर','Byaj calculator'],['reports','chart-no-axes-combined','आज का हिसाब','Daily overview'],['receipt','receipt-text','आखिरी बिल','Latest receipt']];
    return pageHead('और सुविधाएँ','More')+'<main class="mk-main"><div class="mk-panel" style="margin-top:0">'+links.map(l=>'<button type="button" class="mk-list-button" data-go="'+l[0]+'">'+icon(l[1])+'<span>'+text(l[2],l[3])+'</span>'+icon('chevron-right')+'</button>').join('')+'<button type="button" class="mk-list-button" data-action="language">'+icon('languages')+'<span>'+text('English में बदलें','हिन्दी में बदलें')+'</span>'+icon('chevron-right')+'</button></div><div class="mk-section-title">'+text('अंतिम ऐप में सेटिंग्स','Planned app settings')+'</div><div class="mk-panel"><div>'+text('दुकान की जानकारी','Shop profile')+'</div><hr class="mk-divider"><div>'+text('बैकअप और फ़ोन सिंक','Backup & phone sync')+'</div></div></main>';
  }
  function reports() {
    return pageHead('आज का हिसाब','Daily overview',text('1 नवम्बर · नमूना','1 November · Sample'))+'<main class="mk-main"><div class="mk-balance"><small>'+text('आज की बिक्री','Today’s sales')+'</small><strong>₹238.75</strong><small>'+text('1 पूरा बिल','1 completed bill')+'</small></div><div class="mk-panel"><div class="mk-line-event"><span>'+text('नकद मिला','Cash received')+'</span><strong class="mk-money">₹238.75</strong></div><div class="mk-line-event"><span>'+text('UPI मिला','UPI received')+'</span><strong class="mk-money">₹0</strong></div><div class="mk-line-event"><span>'+text('आज दिया उधार','New credit today')+'</span><strong class="mk-money">₹0</strong></div></div><div class="mk-muted" style="margin-top:14px">'+text('बिक्री और मिला भुगतान अलग रखें।','Sales and money received stay separate.')+'</div></main>';
  }
  function render() {
    phone.style.setProperty('--mk-size',state.textSize+'px');
    phone.style.setProperty('--mk-radius',state.radius+'px');
    const pages={home,billing,ledger,interest,inventory,receipt,more,reports};
    content.innerHTML=(pages[state.screen]||home)();
    root.querySelectorAll('.mk-bottom [data-go]').forEach(b=>{
      const active=b.dataset.go===state.screen||(b.dataset.go==='more'&&['interest','inventory','more','reports'].includes(state.screen));
      if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
    });
    root.querySelectorAll('[data-hi]').forEach(el=>{el.textContent=state.hindi?el.dataset.hi:el.dataset.en;});
    if(state.screen==='interest')calculate();
    initIcons();
  }
  function notify(message) {feedback.textContent=message;}
  root.addEventListener('click',event=>{
    const target=event.target.closest('button');if(!target||!root.contains(target))return;
    if(target.dataset.go){state.screen=target.dataset.go;state.cost=null;state.editing=null;notify('');render();persist();return;}
    if(target.dataset.payment){state.payment=target.dataset.payment;render();return;}
    const action=target.dataset.action;
    if(action==='language'){state.hindi=!state.hindi;render();persist();}
    if(action==='voice-demo'){const input=root.querySelector('#mk-search');input.value='मूंगफली';root.querySelector('#mk-search-results').innerHTML=productRows(input.value,false);initIcons();notify(text('हिन्दी आवाज़ की नमूना खोज','Sample Hindi voice-search result'));}
    if(action==='cost'){state.cost=state.cost===target.dataset.id?null:target.dataset.id;if(state.screen==='home'){root.querySelector('#mk-search-results').innerHTML=productRows(root.querySelector('#mk-search').value,false);initIcons();}else if(state.screen==='inventory'){root.querySelector('#mk-inventory-results').innerHTML=productRows(root.querySelector('#mk-inventory-search').value,false);initIcons();}else render();}
    if(action==='show-add'){root.querySelector('#mk-add-items').innerHTML=productRows('',true);initIcons();}
    if(action==='add-product'){const p=products.find(x=>x.id===target.dataset.id);const existing=basket.find(x=>x.id===p.id&&x.rate===p.rate);if(existing)existing.quantity+=1;else basket.push({id:p.id,name:p.name,hindi:p.hindi,quantity:1,rate:p.rate,unit:p.unit});render();}
    if(action==='edit'){const index=Number(target.dataset.index);state.editing=state.editing===index?null:index;render();}
    if(action==='repayment'||action==='charge'){state.ledgerForm=action;render();}
    if(action==='apply-ledger'){const amount=Number(root.querySelector('#mk-ledger-amount').value);if(!Number.isFinite(amount)||amount<=0||(state.ledgerForm==='repayment'&&amount>state.balance)){notify(text('बकाया के अनुसार सही रकम भरें।','Enter a valid amount within the balance.'));return;}state.balance=round(state.balance+(state.ledgerForm==='repayment'?-amount:amount));state.ledgerForm=null;render();notify(text('सिर्फ़ नमूना बदला है; असली भुगतान नहीं हुआ।','Only the sample changed; no real payment was recorded.'));}
    if(action==='reminder'){root.querySelector('#mk-reminder').innerHTML='<div class="mk-note">'+text('नमस्ते, Munsi Kirana Store में आपका ','Hello, your balance at Munsi Kirana Store is ')+money(state.balance)+text(' बाकी है। सुविधा अनुसार भुगतान करें। धन्यवाद।',' Please pay when convenient. Thank you.')+'</div>';notify(text('संदेश की झलक — भेजा नहीं गया।','Message preview — nothing was sent.'));}
    if(action==='calculate')calculate();
    if(action==='share-receipt'){root.querySelector('#mk-share-preview').innerHTML='<div class="mk-note">Munsi Kirana Store · MKS-001<br>'+text('बिल की रकम: ','Bill total: ')+money(total())+'<br>'+text('धन्यवाद! फिर आइए।','Thank you. Visit again!')+'</div>';notify(text('WhatsApp संदेश की झलक — भेजा नहीं गया।','WhatsApp message preview — nothing was sent.'));}
  });
  root.addEventListener('input',event=>{
    const input=event.target;
    if(input.id==='mk-search'){root.querySelector('#mk-search-results').innerHTML=input.value.trim()?productRows(input.value,false):'';initIcons();}
    if(input.id==='mk-inventory-search'){root.querySelector('#mk-inventory-results').innerHTML=productRows(input.value,false);initIcons();}
    if(input.id==='mk-start'||input.id==='mk-end'){const digits=input.value.replace(/\D/g,'').slice(0,8);input.value=digits.slice(0,2)+(digits.length>2?'-'+digits.slice(2,4):'')+(digits.length>4?'-'+digits.slice(4):'');root.querySelector('#mk-interest-results').innerHTML='<div class="mk-note">'+text('बदले हिसाब के लिए फिर निकालें।','Calculate again for the changed dates.')+'</div>';}
    if(input.id==='mk-principal'||input.id==='mk-rate')root.querySelector('#mk-interest-results').innerHTML='<div class="mk-note">'+text('बदली रकम के लिए फिर निकालें।','Calculate again for the changed values.')+'</div>';
  });
  root.addEventListener('change',event=>{
    const input=event.target;
    if(input.dataset.price!==undefined||input.dataset.qty!==undefined){const isPrice=input.dataset.price!==undefined;const index=Number(isPrice?input.dataset.price:input.dataset.qty);const value=Number(input.value);if(!Number.isFinite(value)||value<0||(!isPrice&&value===0)||value>1e6){notify(text('सही भाव और मात्रा भरें।','Enter a valid rate and quantity.'));render();return;}basket[index][isPrice?'rate':'quantity']=value;render();}
  });
  if(window.openai)restore(window.openai.widgetState);
  window.addEventListener('openai:set_globals',event=>{const s=event.detail&&event.detail.globals&&event.detail.globals.widgetState;if(s){restore(s);render();}});
  render();
  if(globalThis.Tweak){
    const tweak=new Tweak({container:phone,onChange:()=>{render();persist();}});
    tweak.addSlider(state,'textSize',{label:'Reading size',min:18,max:22,step:1,unit:'px'});
    tweak.addSlider(state,'radius',{label:'Card corners',min:12,max:24,step:2,unit:'px'});
  }
})();
</script>
